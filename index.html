<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facility Reservation System — Sign In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <p class="eyebrow">Facility Reservation &amp; Approval System</p>
    <h1 id="form-title">Sign in</h1>

    <form id="auth-form">
      <div id="name-field" class="field hidden">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" placeholder="Juan Dela Cruz">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Email Address">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>

      <div id="role-field" class="field hidden">
        <label for="role">Register as</label>
        <select id="role">
          <option value="requester">Requester</option>
          <option value="staff">Facility Staff</option>
          <option value="admin">Administrator</option>
        </select>
        <p class="hint">For grading/demo only — in a live deployment only an Administrator assigns roles.</p>
      </div>

      <button type="submit" id="submit-btn">Sign in</button>
      <p id="error-msg" class="error hidden"></p>
      <p id="info-msg" class="info hidden"></p>
    </form>

    <button id="toggle-mode" class="link-btn">Need an account? Sign up</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
